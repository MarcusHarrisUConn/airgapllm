url: https://marcusharrisphd.com/airgapllm/

template:
  bootstrap: 5
  bootswatch: flatly
  bslib:
    primary: "#264653"
    secondary: "#6e7f8d"
    base_font: {google: "Source Sans Pro"}
    heading_font: {google: "Source Serif 4"}

navbar:
  structure:
    left:  [intro, reference, articles, pdfs, news]
    right: [search, github]
  components:
    pdfs:
      text: PDFs
      menu:
        - text: "IRB / HIPAA Field Guide (PDF)"
          href: airgapllm-guide.pdf
        - text: "Reference Manual (PDF)"
          href: airgapllm-manual.pdf

articles:
  - title: Workflows & Compliance Guides
    navbar: ~
    contents:
      - getting-started
      - privacy-and-compliance
      - irb-hipaa-compliance-walkthrough
      - hpc-gpu-deployment
      - consensus-and-kanonymity

reference:
  - title: Air-Gapped Container Lifecycle, Hardware Sizing & Benchmarking
    desc: Generate pinned, network-isolated Docker and HPC Apptainer configurations, verify model SHA-256 digests, auto-tune local hardware, and benchmark runtime throughput.
    contents:
      - airgap_container_spec
      - emit_docker_run
      - emit_docker_compose
      - emit_apptainer_def
      - verify_model_digest
      - is_loopback_endpoint
      - preflight_isolation_check
      - estimate_vram_requirements
      - recommend_runtime_config
      - benchmark_local_runtime
  - title: Pre-Inference Privacy, PII & k-Anonymity Risk Engine
    desc: Deterministic pure-R PII detection, HIPAA Safe Harbor rules (ages > 89 & restricted ZIP3), zero-PII pre-run audits, and quasi-identifier k-anonymity / l-diversity export controls.
    contents:
      - pii_default_entities
      - hipaa_restricted_zip3
      - pii_config
      - pii_detect
      - pii_redact
      - pii_privacy_report
      - pii_audit_dataframe
      - assess_reidentification_risk
      - apply_k_anonymity
  - title: Keyed Pseudonymization & Encrypted Vaults
    desc: Reversible RFC 5869 HKDF-SHA256 + HMAC-SHA256 pseudonymization with AES-256-CBC Encrypt-then-MAC vaults and atomic key rotation.
    contents:
      - pii_vault_key
      - pii_pseudonymize
      - pii_reidentify
      - pii_vault_save
      - pii_vault_load
      - pii_vault_rotate_key
  - title: Resumable Schema-Enforced & Consensus Batch Extraction
    desc: Long-transcript chunking, strict typed schemas, automated structured repair retries, atomic JSONL crash-resumable batch extraction, and multi-pass self-consistency consensus coding.
    contents:
      - chunk_clinical_texts
      - schema_field
      - extraction_schema
      - as_json_schema
      - validate_extraction
      - build_repair_prompt
      - airgap_extract
      - extraction_accessors
      - airgap_extract_consensus
      - consensus_accessors
  - title: Local Air-Gapped Inference Runtimes
    desc: Loopback-only local HTTP backends (Ollama, llama.cpp, vLLM) and deterministic offline mock runtime.
    contents:
      - runtime_ollama
      - runtime_openai_local
      - runtime_mock
  - title: Immutable Audit Trail & IRB Compliance Documentation
    desc: Tamper-evident SHA-256 hash-chained JSONL logs, IRB/HIPAA/FERPA narrative generation, and sealed compliance packets.
    contents:
      - audit_log_append
      - audit_log_read
      - audit_log_verify
      - generate_irb_narrative
      - export_irb_compliance_packet
  - title: Datasets & Package Overview
    desc: Bundled 100% synthetic clinical/EMA/educational dataset and package documentation.
    contents:
      - synthetic_notes
      - airgapllm-package
